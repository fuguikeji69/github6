<script>
    /* ===================== 配置（只改这里） ===================== */
    // 接口域名：任意一条线路域名都行，按顺序试，一个不通自动换下一个
    var API_HOSTS = [
        'https://bv11.cc'    ];
    // 接口全都不通时的兜底线路（可留空 []）
    var FALLBACK = [
        // { name: '会员线路1', url: 'https://1.bv11.cc/' },
    ];
    var SHOW_AGENT  = true;                    // 代理线路要不要显示在这个公开页上
    var GATE_TITLE  = '富贵搜索';               // 第一屏（搜索页）的网页标题
    var NAV_TITLE   = '导航网';                 // 第二屏（线路页）的网页标题
    var FOOTER_TEXT = '© 2026 Copyright 富贵导航';  // 搜索页页脚
    var REMEMBER    = false;                   // false = 每次打开/刷新都要重新输安全码（改成 true 就记 12 小时）
    var API_TIMEOUT = 5000;                    // 接口超时（毫秒）

    /* ===================== 小工具 ===================== */
    function $(id) { return document.getElementById(id); }
    var PASS_KEY = 'entry_pass_v1', PASS = '', CAP_CODE = '', busy = false;

    function getJSON(url, cb, fail) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.timeout = API_TIMEOUT;
        xhr.onload = function () {
            try { cb(JSON.parse(xhr.responseText)); } catch (e) { fail(); }   // 403 也读 body（里面有 need_entry）
        };
        xhr.onerror = function () { fail(); };
        xhr.ontimeout = function () { fail(); };
        xhr.send();
    }
    function apiGet(path, cb, fail) {
        var i = 0;
        (function next() {
            if (i >= API_HOSTS.length) { if (fail) fail(); return; }
            var host = String(API_HOSTS[i++] || '').replace(/\/+$/, '');
            if (host === '') { next(); return; }
            getJSON(host + path, function (j) { cb(j, host); }, next);
        })();
    }
    function loadPass() {
        if (!REMEMBER) return '';
        try {
            var s = localStorage.getItem(PASS_KEY);
            if (!s) return '';
            var o = JSON.parse(s);
            if (!o || !o.t) return '';
            if (o.exp && o.exp < Math.floor(Date.now() / 1000)) { localStorage.removeItem(PASS_KEY); return ''; }
            return o.t;
        } catch (e) { return ''; }
    }
    function savePass(t, ttl) {
        if (!REMEMBER) return;
        try { localStorage.setItem(PASS_KEY, JSON.stringify({ t: t, exp: Math.floor(Date.now() / 1000) + (ttl || 43200) })); } catch (e) {}
    }
    function clearPass() { try { localStorage.removeItem(PASS_KEY); } catch (e) {} }
    function say(msg) { var e = $('err'); if (e) e.textContent = msg || ''; }

    /* ===================== 两屏切换 ===================== */
    function showGate() {                       // 第一屏：搜索
        document.title = GATE_TITLE;
        if ($('gateView')) $('gateView').style.display = '';
        if ($('navView')) $('navView').style.display = 'none';
        if ($('navFooter')) $('navFooter').style.display = 'none';
        if (window.scrollTo) window.scrollTo(0, 0);
        newCaptcha();
    }
    function showNav() {                        // 第二屏：线路表
        document.title = NAV_TITLE;
        if ($('gateView')) $('gateView').style.display = 'none';
        if ($('navView')) $('navView').style.display = '';
        if ($('navFooter')) $('navFooter').style.display = '';
        if (window.scrollTo) window.scrollTo(0, 0);
        loadLines();
    }

    /* ===================== ① 4 位验证码：本地随机生成（canvas 画好再转成图片） ===================== */
    function newCaptcha() {
        var cvs = document.createElement('canvas');
        cvs.width = 300; cvs.height = 150;
        var g = cvs.getContext('2d');
        g.clearRect(0, 0, 300, 150);                       // 透明底（外面那层 #FBFBFB 就是背景）

        CAP_CODE = '';
        var chars = '0123456789';
        for (var i = 0; i < 4; i++) CAP_CODE += chars.charAt(Math.floor(Math.random() * 10));

        for (var l = 0; l < 5; l++) {                      // 干扰线
            g.strokeStyle = 'rgba(61,136,247,' + (0.10 + Math.random() * 0.18).toFixed(2) + ')';
            g.lineWidth = 1 + Math.random() * 2;
            g.beginPath();
            g.moveTo(Math.random() * 300, Math.random() * 150);
            g.bezierCurveTo(Math.random() * 300, Math.random() * 150, Math.random() * 300, Math.random() * 150, Math.random() * 300, Math.random() * 150);
            g.stroke();
        }
        for (var d = 0; d < 90; d++) {                     // 噪点
            g.fillStyle = 'rgba(61,136,247,' + (0.06 + Math.random() * 0.2).toFixed(2) + ')';
            g.fillRect(Math.random() * 300, Math.random() * 150, 2, 2);
        }
        for (var k = 0; k < 4; k++) {                      // 4 个数字
            g.save();
            var x = 34 + k * 62 + (Math.random() * 10 - 5);
            var y = 96 + (Math.random() * 16 - 8);
            g.translate(x, y);
            g.rotate((Math.random() * 24 - 12) * Math.PI / 180);
            g.font = 'bold ' + (58 + Math.floor(Math.random() * 14)) + 'px Helvetica, Arial, sans-serif';
            g.fillStyle = (Math.random() < 0.5) ? '#2a67d1' : '#3d88f7';
            g.shadowColor = 'rgba(61,136,247,.25)';
            g.shadowBlur = 4;
            g.fillText(CAP_CODE.charAt(k), 0, 0);
            g.restore();
        }
        var img = $('capImg');
        if (img) img.src = cvs.toDataURL('image/png');
        var box = $('code');
        if (box) box.value = '';
    }

    /* ===================== ② 搜索：先本地比验证码，再问服务器关键词对不对 ===================== */
    function doSearch() {
        if (busy) return;
        var q = $('q') ? String($('q').value).trim() : '';
        var c = $('code') ? String($('code').value).replace(/\D/g, '') : '';
        if (q === '') { say('请输入搜索关键词'); $('q').focus(); return; }
        if (c.length !== 4) { say('请输入 4 位数字验证码'); $('code').focus(); return; }
        if (c !== CAP_CODE) {                       // ← 本地比对：验证码本地生成，不用问服务器
            say('验证码错误，请重新输入');
            newCaptcha();
            $('code').focus();
            return;
        }
        say('搜索中…');
        busy = true;
        apiGet('/entry.php?action=verify&kw=' + encodeURIComponent(q) + '&_=' + Date.now(), function (j) {
            busy = false;
            if (j && j.code === 0 && j.pass) {      // 关键词对了 → 进第二屏
                PASS = j.pass;
                savePass(j.pass, j.ttl);
                say('');
                showNav();
                return;
            }
            var m = (j && j.msg) || '关键词不正确';
            if (j && typeof j.left === 'number') m += '（还可以试 ' + j.left + ' 次）';
            say(m);
            newCaptcha();
        }, function () {
            busy = false;
            say('网络不通，请稍后再试');
            newCaptcha();
        });
    }

    /* 线路链接：页面是 https 就一律升成 https（避免混合内容/被浏览器拦） */
    function lineUrl(u, host) {
        var s = String(u || '');
        if (s === '' && host) s = 'https://' + host + '/';
        if (location.protocol === 'https:' && /^http:\/\//i.test(s)) s = s.replace(/^http:\/\//i, 'https://');
        return s;
    }
    /* ===================== ③ 第二屏：取线路（带凭证；后台改了线路这里自动跟着变） ===================== */
    function loadLines() {
        apiGet('/lines.php?fresh=1&_=' + Date.now() + (PASS ? '&k=' + encodeURIComponent(PASS) : ''), function (j) {
            if (j && j.need_entry) {                // 凭证过期 / 被重置 → 回第一屏重新搜
                clearPass(); PASS = '';
                showGate();
                say('请重新输入搜索关键词');
                return;
            }
            var member = (j && j.member) || [], agent = (j && j.agent) || [], rows = [];
            for (var i = 0; i < member.length; i++) rows.push({ name: '会员线路' + (i + 1), url: lineUrl(member[i].url, member[i].host) });
            if (SHOW_AGENT) for (var k = 0; k < agent.length; k++) rows.push({ name: '代理线路' + (k + 1), url: lineUrl(agent[k].url, agent[k].host) });
            if (!rows.length && FALLBACK.length) rows = FALLBACK.slice();
            renderTable(rows);
            startPingTest(rows);
        }, function () {                            // 接口全不通 → 兜底线路，别让页面空着
            renderTable(FALLBACK.slice());
            startPingTest(FALLBACK.slice());
        });
    }
    function renderTable(rows) {        var tbody = $('listBody');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999">暂时取不到线路，请稍后点「再次搜索」</td></tr>';
            return;
        }
        var html = '';
        for (var i = 0; i < rows.length; i++) {
            html += '<tr>' +
                '<td>' + rows[i].name + '</td>' +
                '<td><a href="' + rows[i].url + '" style="color: #1677ff;" target="_blank" class="url">' + rows[i].url + '</a></td>' +
                '<td class="latency"><p><span id="ping' + i + '">测速中...</span></p></td>' +
                '</tr>';
        }
        tbody.innerHTML = html;
    }
    /* 真测速（不是假动画：真去请求一下这条线路） */
    function pingHost(url, cb) {
        var t0 = Date.now(), done = false;
        var timer = setTimeout(function () { fin(-1); }, 5000);
        function fin(ms) { if (done) return; done = true; clearTimeout(timer); cb(ms); }
        var base = String(url || '').replace(/\/+$/, '');
        if (window.fetch) {
            try {
                fetch(base + '/lines.php?ping=' + Date.now(), { mode: 'no-cors', cache: 'no-store' })
                    .then(function () { fin(Date.now() - t0); })
                    .catch(function () { fin(-1); });
                return;
            } catch (e) { /* 老浏览器不支持 → 走下面的 img 方案 */ }
        }
        var img = new Image();
        img.onload = img.onerror = function () { fin(Date.now() - t0); };
        img.src = base + '/favicon.ico?t=' + Date.now();
    }
    function startPingTest(rows) {
        for (var i = 0; i < rows.length; i++) {
            (function (index) {
                setTimeout(function () {
                    pingHost(rows[index].url, function (ms) {
                        var span = $('ping' + index);
                        if (!span) return;
                        if (ms < 0) { span.textContent = '超时'; span.style.color = '#c33'; }
                        else {
                            span.textContent = ms + 'ms';
                            span.style.color = (ms < 300 ? '#3fb950' : (ms < 800 ? '#d29922' : '#c33'));
                        }
                    });
                }, 200 + index * 250);
            })(i);
        }
    }

    /* ===================== 初始化 ===================== */
    document.addEventListener('DOMContentLoaded', function () {
        if (FOOTER_TEXT && $('footBox')) $('footBox').textContent = FOOTER_TEXT;

        var form = $('searchForm');
        if (form) form.addEventListener('submit', function (e) { e.preventDefault(); doSearch(); });
        var rf = $('capRefresh');
        if (rf) rf.addEventListener('click', function () { say(''); newCaptcha(); });
        var ci = $('capImg');
        if (ci) ci.addEventListener('click', function () { say(''); newCaptcha(); });
        var qEl = $('q');
        if (qEl) qEl.addEventListener('keydown', function (e) { if (e.keyCode === 13) { e.preventDefault(); doSearch(); } });

        /* 刷新必须重新输安全码：REMEMBER=false 时不读本地凭证，顺手把以前存过的清掉 */
        if (!REMEMBER) clearPass();
        PASS = loadPass();
        if (PASS) showNav();        // 之前搜过（12 小时内）→ 直接进线路表
        else showGate();
    });
</script>
</body>
</html>
